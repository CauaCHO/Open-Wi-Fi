<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07111f" />
  <title>Internet liberada • Open Wi‑Fi</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="success">
  <main class="shell compact">
    <section class="card center-card">
      <div class="success-icon">✓</div>
      <span class="eyebrow">PAGAMENTO CONFIRMADO</span>
      <h1>Pagamento aprovado!</h1>
      <p>O Open Wi‑Fi registrou a autorização para este dispositivo.</p>
      <div class="access-info">
        <div><span>Plano</span><strong id="successPlan">—</strong></div>
        <div><span>Validade</span><strong id="successValidity">—</strong></div>
      </div>
      <button class="primary" id="continueInternet">Continuar</button>
      <small id="routerNote">A liberação automática na MikroTik será conectada na próxima etapa.</small>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
