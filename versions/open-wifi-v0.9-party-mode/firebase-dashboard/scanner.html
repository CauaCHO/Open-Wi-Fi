<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Escanear convite • Open Wi-Fi</title><link rel="stylesheet" href="./styles.css"><style>.scanner-shell{min-height:100vh;display:grid;place-items:center;padding:18px}.scanner-card{width:min(560px,100%);padding:24px}.camera-wrap{margin-top:20px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#02060b;aspect-ratio:3/4;position:relative}.camera-wrap video{width:100%;height:100%;object-fit:cover}.scan-frame{position:absolute;inset:18% 12%;border:2px solid var(--accent);border-radius:24px;box-shadow:0 0 0 999px rgba(0,0,0,.3)}.scanner-actions{display:grid;gap:10px;margin-top:14px}.scanner-msg{margin-top:12px;color:var(--muted);font-size:13px;line-height:1.5}.file-label{display:block;text-align:center;cursor:pointer}.file-label input{display:none}</style></head>
<body><main class="scanner-shell"><section class="scanner-card card"><div class="brand centered"><div class="brand-mark">⌁</div><div><strong>Open Wi‑Fi</strong><span>Scanner de convite Party</span></div></div><div class="login-copy"><span class="eyebrow">QR DE CONVITE</span><h1>Aponte para o QR do seu amigo</h1><p>Ao reconhecer o convite, você volta automaticamente para o portal local.</p></div><div class="camera-wrap" id="cameraWrap"><video id="camera" playsinline muted></video><div class="scan-frame"></div></div><div class="scanner-actions"><button id="startCamera" class="primary">Abrir câmera</button><label class="ghost file-label">Usar uma foto do QR<input id="photoInput" type="file" accept="image/*" capture="environment"></label><a class="ghost" href="http://10.77.0.254:8080/join.html">Digitar código</a></div><div id="scannerMsg" class="scanner-msg">A câmera só é liberada em HTTPS e após sua permissão.</div></section></main><script type="module" src="./scanner.js"></script></body></html>
